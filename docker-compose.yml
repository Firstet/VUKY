services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    depends_on:
      db: {condition: service_healthy}
    ports: ["3000:3000"]
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: vuky
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_this_database_password}
      POSTGRES_DB: vuky
    volumes: [vuky_pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U vuky -d vuky"]
      interval: 10s
      timeout: 5s
      retries: 10
volumes:
  vuky_pgdata:
